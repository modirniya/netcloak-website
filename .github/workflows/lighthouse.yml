name: Lighthouse

on:
  push:
    branches: [main]
  pull_request:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # sitemap lastmod reads git history

      - name: Build output is committed and current
        run: python3 site/build.py --check

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Serve the repository root
        run: |
          python3 -m http.server 8080 --bind 127.0.0.1 >/dev/null 2>&1 &
          for i in $(seq 1 20); do curl -sf http://127.0.0.1:8080/ >/dev/null && break; sleep 0.5; done

      - name: Lighthouse CI
        run: |
          npx --yes @lhci/cli@0.14.0 autorun \
            --collect.url=http://127.0.0.1:8080/ \
            --collect.url=http://127.0.0.1:8080/no-account/ \
            --collect.url=http://127.0.0.1:8080/faq/ \
            --collect.numberOfRuns=1 \
            --collect.settings.preset=desktop \
            --assert.assertions.categories:performance=error:minScore=0.95 \
            --assert.assertions.categories:accessibility=error:minScore=0.95 \
            --assert.assertions.categories:best-practices=error:minScore=0.95 \
            --assert.assertions.categories:seo=error:minScore=0.95 \
            --upload.target=temporary-public-storage
